<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Kachoo - Slip Gaji Resmi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-wrapper {
            max-width: 1000px;
            width: 100%;
            background: #111;
        }

        .auth-section {
            background: white;
            padding: 40px 24px;
            text-align: center;
            border: 1px solid #ccc;
        }

        .logo-area {
            margin-bottom: 32px;
        }

        .custom-logo {
            width: 200px;
            margin: 0 auto;
            background: black;
            color: white;
            padding: 16px 12px;
            font-weight: 800;
            font-size: 28px;
            letter-spacing: 3px;
            font-family: 'Outfit', sans-serif;
            text-align: center;
        }

        .custom-logo span {
            display: block;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-top: 6px;
        }

        .login-form {
            margin-top: 25px;
        }

        .input-group {
            max-width: 320px;
            margin: 0 auto 20px;
            text-align: left;
        }

        .input-group label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 6px;
            color: black;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            font-family: 'Outfit', monospace;
            border: 1.5px solid black;
            background: white;
            font-size: 16px;
            outline: none;
            border-radius: 0px;
            font-weight: 500;
            color: black;
        }

        .btn-auth {
            background: black;
            color: white;
            border: none;
            padding: 14px 28px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            max-width: 220px;
            transition: 0.2s;
        }

        .btn-auth:hover {
            background: #2c2c2c;
        }

        .error-msg {
            color: #cc0000;
            font-size: 13px;
            margin-top: 10px;
            font-weight: 500;
        }

        .salary-dashboard {
            display: none;
            background: #111;
        }

        .dashboard-header {
            background: white;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid #ddd;
        }

        .company-title {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .logout-btn {
            background: white;
            border: 1px solid black;
            color: black;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Outfit';
            font-size: 14px;
        }

        .welcome-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .welcome-card p {
            font-size: 16px;
            font-weight: 500;
            word-break: break-word;
        }

        .month-selector-container {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .month-selector-container label {
            font-weight: 700;
            font-size: 15px;
            display: block;
            margin-bottom: 16px;
        }

        .month-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .month-btn {
            background: white;
            border: 1.5px solid black;
            padding: 10px 16px;
            font-family: 'Outfit';
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
            min-width: 95px;
        }

        .month-btn.active {
            background: black;
            color: white;
            border-color: black;
        }

        .month-btn:hover:not(.locked) {
            background: black;
            color: white;
        }

        .slip-preview {
            background: transparent;
            margin-top: 25px;
        }

        .payslip-card {
            background: white;
            color: black;
            padding: 24px 20px;
            border: 1px solid #aaa;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 800px;
            margin: 0 auto;
            font-family: 'Outfit', sans-serif;
        }

        .company-header {
            text-align: center;
            border-bottom: 2px solid black;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .company-name {
            font-size: 24px;
            font-weight: 800;
        }

        .company-address {
            font-size: 11px;
            font-weight: 400;
            color: #2c2c2c;
            margin-top: 5px;
        }

        .slip-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            margin: 8px 0 6px;
            text-transform: uppercase;
        }

        .period-badge {
            text-align: center;
            background: #f0f0f0;
            display: inline-block;
            width: auto;
            padding: 5px 18px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            border-bottom: 1px dotted #ddd;
            padding-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .info-label {
            font-weight: 600;
        }

        .info-value {
            font-weight: 500;
            text-align: right;
            word-break: break-word;
        }

        .salary-table {
            width: 100%;
            border-collapse: collapse;
            margin: 18px 0;
            font-size: 14px;
        }

        .salary-table td {
            padding: 10px 6px;
            border-bottom: 1px solid #ccc;
        }

        .salary-table tr:last-child td {
            border-bottom: none;
        }

        .salary-table td:first-child {
            font-weight: 600;
            width: 60%;
        }

        .salary-table td:last-child {
            text-align: right;
            font-weight: 600;
        }

        .total-net {
            background: #f4f4f4;
            font-weight: 800;
            border-top: 2px solid black;
        }

        .total-net td {
            padding: 12px 6px;
        }

        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 9px;
            font-weight: 400;
            color: #3b3b3b;
            border-top: 1px solid #ccc;
            padding-top: 12px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .btn-tarik {
            background: black;
            color: white;
            padding: 12px 32px;
            font-weight: 700;
            font-family: 'Outfit';
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .btn-tarik:hover {
            background: #2b2b2b;
        }

        .message-box {
            text-align: center;
            background: white;
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
            border: 1px solid #ccc;
        }

        .message-box p {
            font-size: 17px;
            font-weight: 500;
            line-height: 1.4;
        }

        .subnote {
            margin-top: 14px;
            font-size: 13px;
            color: #555;
        }

        @media (max-width: 680px) {
            body { padding: 12px; }
            .payslip-card { padding: 18px 16px; }
            .month-btn { padding: 8px 12px; min-width: 80px; font-size: 12px; }
            .company-name { font-size: 20px; }
            .salary-table td { padding: 8px 4px; font-size: 12px; }
            .info-row { font-size: 13px; }
            .btn-tarik { padding: 10px 24px; font-size: 14px; }
            .dashboard-header { padding: 12px 16px; }
            .custom-logo { width: 160px; font-size: 22px; padding: 12px; }
        }

        @media (max-width: 480px) {
            .month-btn { min-width: 70px; font-size: 11px; padding: 6px 8px; }
            .message-box p { font-size: 15px; }
        }
    </style>
</head>
<body>
<div class="app-wrapper" id="appWrapper">
    <div id="authPanel" class="auth-section">
        <div class="logo-area">
            <div class="custom-logo">
                THE KACHOO
                <span>EST. 2026</span>
            </div>
        </div>
        <div class="login-form">
            <div class="input-group">
                <label>Nama Karyawan</label>
                <input type="text" id="employeeNameInput" placeholder="Masukkan nama lengkap..." autocomplete="off">
            </div>
            <button id="enterButton" class="btn-auth">MASUK & AKSES GAJI</button>
            <div id="loginError" class="error-msg"></div>
            <div style="font-size:12px; margin-top:18px; color:#333;">Fitur Payroll ini dibuat oleh CHOBANK dan sistem Vaultx</div>
        </div>
    </div>

    <div id="salaryDashboard" class="salary-dashboard">
        <div class="dashboard-header">
            <div class="company-title">THE KACHOO PAYROLL - 2026</div>
            <button id="logoutDashboardBtn" class="logout-btn">Keluar</button>
        </div>
        <div id="welcomeUserArea" class="welcome-card">
            <p id="welcomeText"></p>
        </div>
        <div class="month-selector-container">
            <label>Pilih Bulan Gaji</label>
            <div class="month-buttons" id="monthButtonsContainer"></div>
        </div>
        <div class="slip-preview" id="slipPreviewArea"></div>
    </div>
</div>

<script>
    // SEMUA BULAN TAHUN 2026
    const months2026 = [
        { name: "Januari 2026", offset: 0, unlockDay: 30, isLaunching: true },
        { name: "Februari 2026", offset: 1, unlockDay: 30, isLaunching: false },
        { name: "Maret 2026", offset: 2, unlockDay: 30, isLaunching: false },
        { name: "April 2026", offset: 3, unlockDay: 30, isLaunching: false },
        { name: "Mei 2026", offset: 4, unlockDay: 30, isLaunching: false },
        { name: "Juni 2026", offset: 5, unlockDay: 30, isLaunching: false },
        { name: "Juli 2026", offset: 6, unlockDay: 30, isLaunching: false },
        { name: "Agustus 2026", offset: 7, unlockDay: 30, isLaunching: false },
        { name: "September 2026", offset: 8, unlockDay: 30, isLaunching: false },
        { name: "Oktober 2026", offset: 9, unlockDay: 30, isLaunching: false },
        { name: "November 2026", offset: 10, unlockDay: 30, isLaunching: false },
        { name: "Desember 2026", offset: 11, unlockDay: 30, isLaunching: false }
    ];

    const employeesData = {
        "Gathur Delano Kafka": {
            name: "Gathur Delano Kafka", position: "CEO",
            startMonth: 1, baseStartSalary: 10000, incentive: 1500, incentiveStartMonth: 1,
            hasNormalIncrease: true
        },
        "Ningrum Anindita Kafka": {
            name: "Ningrum Anindita Kafka", position: "CFO",
            startMonth: 2, baseStartSalary: 5000, incentive: 1200, incentiveStartMonth: 2,
            hasNormalIncrease: true
        },
        "Isaac Logan": {
            name: "Isaac Logan", position: "COO",
            startMonth: 3, baseStartSalary: 5500, incentive: 1000, incentiveStartMonth: 4,
            hasNormalIncrease: true
        },
        "Geriel Rakhastra": {
            name: "Geriel Rakhastra", position: "Secretary",
            startMonth: 3, baseStartSalary: 1500, incentive: 600, incentiveStartMonth: 4,
            hasNormalIncrease: false, increaseStartMonth: 4
        },
        "Ashraffi Yudha": {
            name: "Ashraffi Yudha", position: "Head Editor",
            startMonth: 1, baseStartSalary: 3000, incentive: 800, incentiveStartMonth: 1,
            hasNormalIncrease: true
        },
        "Claudia Charmaine": {
            name: "Claudia Charmaine", position: "Creative Designer",
            startMonth: 1, baseStartSalary: 2500, incentive: 700, incentiveStartMonth: 1,
            hasNormalIncrease: true
        },
        "Vivianne Jamila": {
            name: "Vivianne Jamila", position: "Public Relation",
            startMonth: 1, baseStartSalary: 2000, incentive: 600, incentiveStartMonth: 1,
            hasNormalIncrease: true
        },
        "Nona Rengganis Kinandari Panchakarma": {
            name: "Nona Rengganis Kinandari Panchakarma", position: "Color Specialist",
            startMonth: 1, baseStartSalary: 2000, incentive: 600, incentiveStartMonth: 1,
            hasNormalIncrease: true
        },
        "Lucius Vincent": {
            name: "Lucius Vincent", position: "Editor Staff",
            startMonth: 3, baseStartSalary: 1500, incentive: 600, incentiveStartMonth: 4,
            hasNormalIncrease: false, increaseStartMonth: 4
        }
    };

    function isMonthUnlocked(monthObj) {
        if (monthObj.isLaunching) return false;
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();
        const currentDate = now.getDate();
        
        const targetYear = 2026;
        const targetMonth = monthObj.offset;
        const targetDay = monthObj.unlockDay;
        
        if (currentYear > targetYear) return true;
        if (currentYear < targetYear) return false;
        if (currentMonth > targetMonth) return true;
        if (currentMonth === targetMonth && currentDate >= targetDay) return true;
        return false;
    }

    function getGrossBase(emp, targetMonthOffset) {
        if (targetMonthOffset < emp.startMonth) return null;
        
        if (emp.hasNormalIncrease === false && emp.increaseStartMonth) {
            if (targetMonthOffset < emp.increaseStartMonth) {
                return emp.baseStartSalary;
            } else {
                const increaseMonths = targetMonthOffset - emp.increaseStartMonth;
                return emp.baseStartSalary * (1 + (increaseMonths * 0.10));
            }
        }
        
        if (emp.hasNormalIncrease) {
            const monthsSinceStart = targetMonthOffset - emp.startMonth;
            return emp.baseStartSalary * (1 + (monthsSinceStart * 0.10));
        }
        
        return emp.baseStartSalary;
    }

    function getEarlyBonus(emp, targetMonthOffset, grossBase) {
        if (emp.hasNormalIncrease === false && emp.increaseStartMonth) {
            if (targetMonthOffset < emp.increaseStartMonth) {
                return 0;
            }
        }
        return grossBase * 0.10;
    }

    function computeSalaryForEmployee(emp, targetMonthOffset) {
        if (targetMonthOffset < emp.startMonth) return null;
        
        const grossBase = getGrossBase(emp, targetMonthOffset);
        if (grossBase === null) return null;
        
        const earlyBonus = getEarlyBonus(emp, targetMonthOffset, grossBase);
        
        let incentivePay = 0;
        if (targetMonthOffset >= emp.incentiveStartMonth) {
            incentivePay = emp.incentive;
        }
        
        const totalGross = grossBase + earlyBonus + incentivePay;
        const provident = totalGross * 0.02;
        const professionalTax = totalGross * 0.05;
        const netSalary = totalGross - provident - professionalTax;
        
        return { grossBase, earlyBonus, incentivePay, totalGross, provident, professionalTax, netSalary };
    }

    const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });

    const authPanel = document.getElementById('authPanel');
    const dashboardDiv = document.getElementById('salaryDashboard');
    const employeeNameInput = document.getElementById('employeeNameInput');
    const enterBtn = document.getElementById('enterButton');
    const loginErrorSpan = document.getElementById('loginError');
    const monthButtonsContainer = document.getElementById('monthButtonsContainer');
    const slipPreviewArea = document.getElementById('slipPreviewArea');
    const logoutBtn = document.getElementById('logoutDashboardBtn');
    const welcomeTextSpan = document.getElementById('welcomeText');

    let currentUser = null;
    let currentSelectedMonthOffset = null;

    function authenticateEmployee(inputName) {
        const trimmed = inputName.trim().toLowerCase();
        const foundKey = Object.keys(employeesData).find(key => key.toLowerCase() === trimmed);
        if (foundKey) {
            currentUser = employeesData[foundKey];
            loginErrorSpan.textContent = '';
            return true;
        } else {
            loginErrorSpan.textContent = 'Nama tidak terdaftar.';
            return false;
        }
    }

    // Menentukan bulan terakhir yang slipnya sudah tersedia untuk karyawan ini
    function getLastAvailableMonthForEmployee() {
        let lastAvailable = currentUser.startMonth; // minimal bulan mulai bekerja
        
        for (let i = months2026.length - 1; i >= 0; i--) {
            const month = months2026[i];
            if (month.isLaunching) continue;
            if (month.offset < currentUser.startMonth) continue;
            
            const unlocked = isMonthUnlocked(month);
            if (unlocked) {
                lastAvailable = month.offset;
                break;
            }
        }
        return lastAvailable;
    }

    function renderMonthButtons() {
        monthButtonsContainer.innerHTML = '';
        months2026.forEach((month) => {
            const btn = document.createElement('button');
            btn.textContent = month.name;
            btn.classList.add('month-btn');
            
            if (currentSelectedMonthOffset === month.offset) {
                btn.classList.add('active');
            }
            
            btn.addEventListener('click', () => {
                currentSelectedMonthOffset = month.offset;
                renderMonthButtons();
                renderPayslip();
            });
            
            monthButtonsContainer.appendChild(btn);
        });
    }

    function renderPayslip() {
        if (!currentUser || currentSelectedMonthOffset === null) return;
        
        const targetMonth = months2026.find(m => m.offset === currentSelectedMonthOffset);
        if (!targetMonth) return;
        
        if (targetMonth.isLaunching) {
            slipPreviewArea.innerHTML = `
                <div class="message-box">
                    <p>Kachoo Launching</p>
                    <div class="subnote">The Kachoo resmi beroperasi mulai Februari 2026. Terima kasih!</div>
                </div>
            `;
            return;
        }
        
        const unlocked = isMonthUnlocked(targetMonth);
        const isEmployed = currentSelectedMonthOffset >= currentUser.startMonth;
        
        if (!unlocked) {
            slipPreviewArea.innerHTML = `
                <div class="message-box">
                    <p>Maaf, tarik gaji hanya bisa diambil pada tanggal 30 di bulan yang sama. Silahkan kembali lagi nanti.</p>
                    <div class="subnote">Slip gaji ${targetMonth.name} baru bisa diakses pada tanggal 30 ${targetMonth.name.split(' ')[0]} 2026.</div>
                </div>
            `;
            return;
        }
        
        if (!isEmployed) {
            const startMonthName = months2026.find(m => m.offset === currentUser.startMonth)?.name || 'bulan masuk';
            slipPreviewArea.innerHTML = `
                <div class="message-box">
                    <p>Anda mulai bekerja pada ${startMonthName}. Belum menerima gaji untuk periode ${targetMonth.name}.</p>
                </div>
            `;
            return;
        }
        
        const payroll = computeSalaryForEmployee(currentUser, targetMonth.offset);
        if (!payroll) {
            slipPreviewArea.innerHTML = `<div class="message-box"><p>Data gaji tidak tersedia untuk bulan ini.</p></div>`;
            return;
        }
        
        const slipHTML = `
            <div class="payslip-card" id="payslipToCapture">
                <div class="company-header">
                    <div class="company-name">THE KACHOO</div>
                    <div class="company-address">Jenderal Sudirman Avenue, Lots 61–62, South Jakarta 12930, Indonesia.</div>
                </div>
                <div class="slip-title">SLIP GAJI BULANAN</div>
                <div style="text-align:center;">
                    <div class="period-badge">${targetMonth.name}</div>
                </div>
                <div class="info-row">
                    <span class="info-label">Nama Karyawan</span>
                    <span class="info-value">${currentUser.name}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Jabatan</span>
                    <span class="info-value">${currentUser.position}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Gaji Pokok Bulan Ini</span>
                    <span class="info-value">${usd.format(payroll.grossBase)}</span>
                </div>
                <table class="salary-table">
                    <tr><td>Gaji Pokok</td><td>${usd.format(payroll.grossBase)}</td></tr>
                    ${payroll.earlyBonus > 0 ? `<tr><td>Bonus Awal Bulan (10% dari gaji pokok)</td><td>${usd.format(payroll.earlyBonus)}</td></tr>` : ''}
                    ${payroll.incentivePay > 0 ? `<tr><td>Incentive Pay</td><td>${usd.format(payroll.incentivePay)}</td></tr>` : ''}
                    <tr><td style="border-top:1px solid #aaa;">Total Penghasilan Kotor</td><td style="border-top:1px solid #aaa;">${usd.format(payroll.totalGross)}</td></tr>
                    <tr><td>Provident Fund (2% dari total kotor)</td><td>${usd.format(payroll.provident)}</td></tr>
                    <tr><td>Professional Tax (5% dari total kotor)</td><td>${usd.format(payroll.professionalTax)}</td></tr>
                    <tr class="total-net"><td><strong>GAJI BERSIH (Take Home)</strong></td><td><strong>${usd.format(payroll.netSalary)}</strong></td></tr>
                </table>
                <div class="footer-note">For Roleplay Purpose Only made by Kachoo</div>
            </div>
            <div class="action-buttons">
                <button id="tarikGajiBtn" class="btn-tarik">Tarik Gaji (PNG)</button>
            </div>
        `;
        slipPreviewArea.innerHTML = slipHTML;
        
        const tarikBtn = document.getElementById('tarikGajiBtn');
        if (tarikBtn) {
            tarikBtn.addEventListener('click', async () => {
                const slipElement = document.getElementById('payslipToCapture');
                if (!slipElement) return;
                try {
                    const canvas = await html2canvas(slipElement, {
                        scale: 2.5,
                        backgroundColor: '#ffffff',
                        logging: false,
                        useCORS: false
                    });
                    const link = document.createElement('a');
                    link.download = `payslip_${currentUser.name.replace(/\s/g, '_')}_${targetMonth.name.replace(/\s/g, '_')}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch(e) {
                    alert("Gagal generate PNG.");
                }
            });
        }
    }

    function initDashboard() {
        welcomeTextSpan.innerHTML = `Selamat datang, <strong>${currentUser.name}</strong> - ${currentUser.position}`;
        // BUKA BULAN TERAKHIR YANG SLIPNYA SUDAH TERSEDIA
        currentSelectedMonthOffset = getLastAvailableMonthForEmployee();
        renderMonthButtons();
        renderPayslip();
    }

    function showDashboard() {
        authPanel.style.display = 'none';
        dashboardDiv.style.display = 'block';
        initDashboard();
    }

    function logout() {
        currentUser = null;
        authPanel.style.display = 'block';
        dashboardDiv.style.display = 'none';
        employeeNameInput.value = '';
        loginErrorSpan.textContent = '';
        slipPreviewArea.innerHTML = '';
    }

    enterBtn.addEventListener('click', () => {
        if (authenticateEmployee(employeeNameInput.value)) showDashboard();
    });
    employeeNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && authenticateEmployee(employeeNameInput.value)) showDashboard();
    });
    logoutBtn.addEventListener('click', logout);

    authPanel.style.display = 'block';
    dashboardDiv.style.display = 'none';
</script>
</body>
    </html>
